<!doctype html>
<html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#182a30">
<link rel="manifest" href="kinetik.webmanifest">
<link rel="icon" href="icon.svg">
<title>KINEtiK FPS · NODO 09</title>
<style>
:root { --surface-width: 100vw; --surface-height: 100vh; }
@supports (width: 100dvw) and (height: 100dvh) {
  :root { --surface-width: 100dvw; --surface-height: 100dvh; }
}
html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #101824; }
#game-frame {
  position: absolute; left: 0; top: 0; display: block; border: 0; padding: 0;
  width: var(--surface-width); height: var(--surface-height); color-scheme: dark;
}
@media (orientation: portrait) {
  #game-frame {
    left: var(--surface-width); width: var(--surface-height); height: var(--surface-width);
    transform-origin: top left; transform: rotate(90deg);
  }
}
.device-inset { position: absolute; top: 0; left: 0; visibility: hidden; pointer-events: none; }
#inset-start { width: env(safe-area-inset-left, 0px); height: env(safe-area-inset-top, 0px); }
#inset-end { width: env(safe-area-inset-right, 0px); height: env(safe-area-inset-bottom, 0px); }
</style></head><body>
<iframe id="game-frame" title="KINEtiK FPS" allow="autoplay; fullscreen" allowfullscreen></iframe>
<i id="inset-start" class="device-inset" aria-hidden="true"></i>
<i id="inset-end" class="device-inset" aria-hidden="true"></i>
<script>
  const frame = document.getElementById('game-frame');
  const startInset = document.getElementById('inset-start');
  const endInset = document.getElementById('inset-end');
  const portrait = matchMedia('(orientation: portrait)');
  const dynamicUnits = window.CSS?.supports('(width: 100dvw) and (height: 100dvh)');
  const sides = ['top', 'right', 'bottom', 'left'];
  let pending = false;

  function updateLayout() {
    pending = false;
    if (!dynamicUnits) {
      const viewport = window.visualViewport;
      const unzoomed = viewport && viewport.scale === 1;
      const w = unzoomed ? viewport.width : window.innerWidth;
      const h = unzoomed ? viewport.height : window.innerHeight;
      if (w > 0 && h > 0) {
        document.documentElement.style.setProperty('--surface-width', w + 'px');
        document.documentElement.style.setProperty('--surface-height', h + 'px');
      }
    }

    const root = frame.contentDocument?.documentElement;
    if (!root) return;
    const start = startInset.getBoundingClientRect(), end = endInset.getBoundingClientRect();
    const device = [start.height, end.width, end.height, start.width];
    // When the frame turns clockwise, its top faces the device's right edge.
    const shift = portrait.matches ? 1 : 0;
    let changed = false;
    sides.forEach((side, i) => {
      const name = '--game-safe-' + side;
      const value = device[(i + shift) % 4] + 'px';
      if (root.style.getPropertyValue(name) === value) return;
      root.style.setProperty(name, value);
      changed = true;
    });
    if (changed) frame.contentWindow.dispatchEvent(new frame.contentWindow.Event('kinetik-safe-area'));
  }
  function scheduleLayout() {
    if (pending) return;
    pending = true;
    requestAnimationFrame(updateLayout);
  }
  function landscape() {
    try { screen.orientation?.lock?.('landscape')?.catch?.(() => {}); } catch {}
  }
  function restoreViewport() { landscape(); scheduleLayout(); }

  window.addEventListener('pageshow', restoreViewport);
  document.addEventListener('fullscreenchange', restoreViewport);
  window.addEventListener('resize', scheduleLayout);
  window.visualViewport?.addEventListener('resize', scheduleLayout);
  window.addEventListener('orientationchange', scheduleLayout);
  portrait.addEventListener?.('change', scheduleLayout);
  if (typeof ResizeObserver !== 'undefined') {
    const observer = new ResizeObserver(scheduleLayout);
    observer.observe(startInset);
    observer.observe(endInset);
  }
  frame.addEventListener('load', () => {
    updateLayout();
    frame.contentDocument?.addEventListener('pointerdown', landscape, {once:true, passive:true});
  });

  const game = new URL('./index.html', location.href);
  game.search = location.search; game.hash = location.hash;
  updateLayout();
  frame.src = game.href;
  landscape();
</script></body></html>
