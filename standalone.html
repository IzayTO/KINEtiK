<!doctype html>
<html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#182a30">
<link rel="manifest" href="kinetik.webmanifest">
<link rel="icon" href="icon.svg">
<title>KINEtiK FPS · NODO 09</title>
<style>
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#101824}
iframe{border:0;display:block;position:absolute;top:env(safe-area-inset-top,0px);left:env(safe-area-inset-left,0px);width:calc(100% - env(safe-area-inset-left,0px) - env(safe-area-inset-right,0px));height:calc(100% - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));color-scheme:dark}
@media(orientation:portrait){
  iframe{inset:auto;left:calc(100% - env(safe-area-inset-right,0px));top:env(safe-area-inset-top,0px);width:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));height:calc(100vw - env(safe-area-inset-left,0px) - env(safe-area-inset-right,0px));width:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));height:calc(100dvw - env(safe-area-inset-left,0px) - env(safe-area-inset-right,0px));transform-origin:top left;transform:rotate(90deg)}
}
</style></head><body>
<iframe id="game-frame" title="KINEtiK FPS" allow="autoplay; fullscreen" allowfullscreen></iframe>
<script>
  const frame = document.getElementById('game-frame');
  const game = new URL('./index.html', location.href);
  game.search = location.search; game.hash = location.hash;
  frame.src = game.href;
  function landscape() {
    try { const result = screen.orientation?.lock?.('landscape'); result?.catch?.(()=>{}); } catch {}
  }
  landscape();
  window.addEventListener('pageshow', landscape);
  document.addEventListener('fullscreenchange', landscape);
  frame.addEventListener('load', () => frame.contentDocument?.addEventListener('pointerdown', landscape, {once:true,passive:true}));
</script></body></html>
